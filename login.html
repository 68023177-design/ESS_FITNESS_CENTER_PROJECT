<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ESS Fitness Center</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body data-page="login">
  <nav id="navbar" class="navbar"></nav>
  <div id="toast-box" class="toast-box"></div>

  <main class="auth-wrap">
    <div class="card auth-card">
      <h1 class="auth-title">เข้าสู่ระบบ</h1>
      <p class="muted">ยินดีต้อนรับกลับ! เข้าสู่ระบบเพื่อจัดการแพคเกจของคุณ</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">อีเมล</label>
          <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@up.ac.th">
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <p id="form-error" class="form-error"></p>
        <button type="submit" class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
      </form>
      <p class="auth-switch">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
    </div>
  </main>

  <footer class="footer"><p>ESS Fitness Center · มหาวิทยาลัยพะเยา</p></footer>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
